name: image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "tests/**", "tools/**", "scripts/**", "site/**", ".github/workflows/pages.yml", "smartcam_proxy/**", "repository.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda              # NVIDIA GPU
            base: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
            tags: |
              ghcr.io/${{ github.repository }}:latest
              ghcr.io/${{ github.repository }}:${{ github.sha }}
          - variant: intel             # OpenVINO on an Intel iGPU
            base: ubuntu:26.04
            tags: |
              ghcr.io/${{ github.repository }}:intel
              ghcr.io/${{ github.repository }}:intel-${{ github.sha }}
    steps:
      - name: Free disk space   # the CUDA base image and torch (model export) overflow the default runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VARIANT=${{ matrix.variant }}
            BASE=${{ matrix.base }}
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
