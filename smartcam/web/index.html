<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartCam</title>
<style>
  /* Home Assistant's look: Roboto, its primary blue, rounded cards, a plain app bar. */
  :root {
    --primary: #03a9f4; --bg: #fafafa; --card: #fff; --fg: #212121; --muted: #727272; --line: rgba(0,0,0,.12);
    --bar: #fff; --error: #db4437; --ok: #43a047; --warn: #ff9800; --field: #f5f5f5;
    --shadow: 0 2px 2px 0 rgba(0,0,0,.14), 0 1px 5px 0 rgba(0,0,0,.12), 0 3px 1px -2px rgba(0,0,0,.2);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --card: #1c1c1c; --fg: #e1e1e1; --muted: #9b9b9b; --line: rgba(225,225,225,.12);
            --bar: #1c1c1c; --field: #2a2a2a; --shadow: 0 0 0 1px rgba(225,225,225,.06); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 Roboto, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); }
  a { color: var(--primary); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 16px;
           background: var(--bar); border-bottom: 1px solid var(--line); }
  h1 { font-size: 20px; font-weight: 500; margin: 0; }
  nav { display: flex; gap: 4px; }
  nav button { font: inherit; font-weight: 500; padding: 8px 14px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
  nav button[aria-pressed="true"] { color: var(--primary); background: color-mix(in srgb, var(--primary) 12%, transparent); }
  .away { margin-left: auto; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; color: var(--muted); font-weight: 500; }
  .away + .away { margin-left: 0; }
  .alarm { font: inherit; font-weight: 500; padding: 6px 14px; border-radius: 16px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; }
  .alarm[data-state="armed_away"], .alarm[data-state="arming"] { color: #fff; background: var(--primary); border-color: var(--primary); }
  .alarm[data-state="pending"] { color: #fff; background: var(--warn); border-color: var(--warn); }
  .alarm[data-state="armed_home"] { color: #fff; background: var(--ok); border-color: var(--ok); }
  .arm-menu { position: absolute; right: 0; top: 40px; display: flex; gap: 6px; padding: 8px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); z-index: 10; white-space: nowrap; }
  .alarm[data-state="triggered"] { color: #fff; background: var(--error); border-color: var(--error); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 640px) {
    /* two rows on phones: title + home/alarm, then the tabs across the full width */
    header { height: auto; flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; }
    h1 { font-size: 18px; }
    nav { order: 3; width: 100%; }
    nav button { flex: 1; padding: 8px 4px; }
    .away { gap: 6px; }
    .alarm { padding: 5px 10px; font-size: 13px; }
    main { padding: 12px; }
  }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
  figure, .card { margin: 0; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  figcaption img.face { width: 40px; height: 48px; object-fit: cover; border-radius: 6px; }
  .who { color: var(--primary); }
  figcaption { padding: 8px 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
  small, .muted { color: var(--muted); }
  iframe, figure img, figure video { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; object-fit: contain; }
  .score { font-weight: 500; }
  .score.high { color: var(--error); }
  .chip { font: inherit; font-size: 13px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 16px; background: none; color: var(--fg); cursor: pointer; }
  a.chip { text-decoration: none; display: inline-block; }
  .chip[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); }
  [hidden] { display: none !important; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .filters select, .filters input { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 6px 12px; }

  /* toggle switch, as in HA */
  .switch { position: relative; width: 36px; height: 14px; border-radius: 7px; background: var(--line); flex: none; }
  .switch::after { content: ""; position: absolute; top: -3px; left: -2px; width: 20px; height: 20px; border-radius: 50%; background: #fafafa; box-shadow: var(--shadow); transition: left .15s; }
  input:checked + .switch, [aria-checked="true"] > .switch { background: color-mix(in srgb, var(--primary) 50%, transparent); }
  input:checked + .switch::after, [aria-checked="true"] > .switch::after { left: 18px; background: var(--primary); }
  label.toggle { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  label.toggle input { position: absolute; opacity: 0; pointer-events: none; }

  /* settings */
  .settings { display: grid; gap: 16px; max-width: 980px; margin: 0 auto; }
  .card h2 { font-size: 18px; font-weight: 500; margin: 0; padding: 16px 16px 0; }
  .card .desc { margin: 4px 16px 0; color: var(--muted); }
  .fields { display: grid; gap: 12px 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); padding: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span { font-size: 12px; color: var(--muted); font-weight: 500; }
  .field input, .field select { font: inherit; color: var(--fg); background: var(--field); border: 0; border-bottom: 1px solid var(--muted);
                                border-radius: 4px 4px 0 0; padding: 10px 12px; width: 100%; }
  .field input:focus, .field select:focus { outline: none; border-bottom: 2px solid var(--primary); }
  .field small { font-size: 12px; }
  .field.wide { grid-column: 1 / -1; }
  .field.toggle-field { justify-content: center; }
  .btn { font: inherit; font-weight: 500; font-size: 14px; height: 36px; padding: 0 16px; border-radius: 18px; border: 0; cursor: pointer;
         background: none; color: var(--primary); }
  .btn.filled { background: var(--primary); color: #fff; }
  .btn.danger { color: var(--error); }
  .btn.outlined { border: 1px solid var(--line); }
  .btn:disabled { opacity: .45; cursor: default; }
  .cam { border-top: 1px solid var(--line); }
  .cam-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; }
  .cam-head b { font-size: 16px; font-weight: 500; }
  .cam-head .btn:first-of-type { margin-left: auto; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 16px 16px; }
  .add-row { align-items: flex-end; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
  .add-row .field { flex: 1; max-width: 320px; }
  .add-row .btn { height: 41px; }   /* the input's height, so the two line up */
  .savebar { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 12px 16px;
             background: var(--bar); border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; box-shadow: var(--shadow); }
  .savebar .msg { margin-right: auto; }
  .msg.error { color: var(--error); white-space: pre-wrap; }
  .msg.ok { color: var(--ok); }

  /* zone editor */
  .editor { padding: 0 16px 16px; }
  .stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; touch-action: none; }
  .stage img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: fill; opacity: .9; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .layers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
  .layers input { font: inherit; padding: 4px 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--field); color: var(--fg); width: 140px; }
  .legend { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  /* Wall view: every camera on one screen, nothing else, for keeping an eye on things from a desk. */
  .live-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .live-bar[hidden], #wall-bar[hidden] { display: none; }
  body.wall { background: #000; overflow: hidden; }
  body.wall header, body.wall .live-bar, body.wall #status { display: none; }
  body.wall main { padding: 0; max-width: none; }
  body.wall #live { position: fixed; inset: 0; gap: 4px; padding: 4px; align-content: center; justify-content: center;
                    grid-template-columns: repeat(var(--cols), var(--tile-w)); grid-auto-rows: var(--tile-h); grid-auto-flow: dense; }
  body.wall #live figure { position: relative; border-radius: 4px; box-shadow: none; background: #000; outline: 3px solid transparent; outline-offset: -3px; }
  body.wall #live figure.featured { grid-column: span 2; grid-row: span 2; }
  body.wall #live iframe { width: 100%; height: 100%; aspect-ratio: auto; }
  body.wall #live figcaption { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; }
  body.wall #live figcaption a { color: #fff; text-decoration: none; }
  body.wall #live figcaption small { display: none; }
  body.wall #live .hit { position: absolute; inset: 0; cursor: zoom-in; }   /* over the player: a click picks the tile */
  body.wall #live figure.person { outline-color: var(--error); }
  body.wall #live figure.person figcaption { background: var(--error); }
  body.wall #live figure.person figcaption::after { content: " · person"; }
  #wall-bar { position: fixed; top: 8px; right: 8px; z-index: 6; display: flex; gap: 6px; align-items: center; padding: 4px 6px;
              border-radius: 18px; background: rgba(0,0,0,.55); color: #fff; opacity: 0; transition: opacity .3s; }
  #wall-bar:hover, body.wall.awake #wall-bar { opacity: 1; }
  #wall-bar .chip { color: #fff; border-color: rgba(255,255,255,.35); }
  #wall-bar .chip[aria-pressed="true"] { color: #fff; background: var(--primary); border-color: var(--primary); }
  #wall-feed { position: fixed; inset: 0; z-index: 4; background: #000; }
  #wall-feed[hidden] { display: none; }
  #wall-feed iframe { width: 100%; height: 100%; border: 0; display: block; }
  #wall-clock { font-variant-numeric: tabular-nums; padding: 0 6px; }
  .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0,0,0,.45); color: #fff; font-size: 18px; }
</style>
</head>
<body>
<header>
  <h1>SmartCam</h1>
  <nav>
    <button id="tab-live" aria-pressed="true">Live</button>
    <button id="tab-events" aria-pressed="false">Events</button>
    <button id="tab-settings" aria-pressed="false">Settings</button>
  </nav>
  <div class="away" id="wfh" role="switch" aria-checked="false" tabindex="0" title="Working from home: push every person outside, day and night"><span>WFH</span><span class="switch"></span></div>
  <div class="away" id="away" role="switch" aria-checked="false" tabindex="0"><span id="away-label">Home</span><span class="switch"></span></div>
  <span style="position:relative"><button class="alarm" id="alarm" hidden title="Arm or disarm the alarm">Alarm off</button>
    <span class="arm-menu" id="arm-menu" hidden><button class="chip" data-cmd="arm_away">Arm away</button><button class="chip" data-cmd="arm_home">Arm home</button></span>
    <span class="arm-menu" id="answer-menu" hidden><button class="chip" data-cmd="confirm">Confirm alarm</button><button class="chip" data-cmd="false_alarm">False alarm</button><button class="chip" data-cmd="stop" hidden>Stop siren</button><button class="chip" data-cmd="disarm">Disarm</button></span></span>
</header>
<main>
  <div class="live-bar" id="live-bar"><button class="btn" id="wall-open" title="All cameras on one screen, for keeping an eye on things">Wall view</button></div>
  <section id="live" class="grid"></section>
  <div id="wall-feed" hidden></div>
  <div id="wall-bar" hidden>
    <span id="wall-clock"></span><span id="wall-alarm"></span>
    <button class="chip" id="wall-one" aria-pressed="false" title="All cameras as one video, put together by SmartCam: lighter for a TV, an old tablet or mobile data">One feed</button>
    <button class="chip" id="wall-follow" aria-pressed="true" title="Enlarge a camera while it sees a person">Follow people</button>
    <button class="chip" id="wall-full">Full screen</button>
    <button class="chip" id="wall-close">Close</button>
  </div>
  <div id="event-filters" class="filters" hidden>
    <select id="f-kind"><option value="">All events</option><option value="person">People</option><option value="vehicle">Vehicles</option><option value="doorbell">Doorbell</option><option value="smoke">Smoke</option><option value="notified">Notified only</option></select>
    <select id="f-camera"><option value="">All cameras</option></select>
    <select id="f-time"><option value="">Any time</option><option value="1h">Last hour</option><option value="today">Today</option><option value="24h">Last 24 hours</option><option value="7d">Last 7 days</option><option value="day">Pick a day…</option></select>
    <input type="date" id="f-day" hidden>
  </div>
  <section id="events" class="grid" hidden></section>
  <section id="settings" class="settings" hidden></section>
  <p id="status" class="muted"></p>
</main>
<div class="overlay" id="overlay" hidden>Restarting SmartCam…</div>
<script>
const GO2RTC = "go2rtc";   // proxied by smartcam, relative so it works under a path prefix
const $ = id => document.getElementById(id);
const fmt = ts => new Date(ts * 1000).toLocaleString();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const json = (method, body) => ({method, headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});

function showTab(name) {
  for (const t of ["live", "events", "settings"]) {
    $(t).hidden = t !== name;
    if (t === "live") $("live-bar").hidden = t !== name;
    $("tab-" + t).setAttribute("aria-pressed", t === name);
  }
  $("event-filters").hidden = name !== "events";
  $("status").textContent = "";
  if (name === "events") loadEvents();
  if (name === "settings") loadSettings();
}
for (const t of ["live", "events", "settings"]) $("tab-" + t).onclick = () => showTab(t);

// --- away mode -----------------------------------------------------------------------------------
async function loadAway() {
  const {away} = await (await fetch("api/away")).json();
  $("away").setAttribute("aria-checked", away);
  $("away-label").textContent = away ? "Away" : "Home";
  const {wfh} = await (await fetch("api/wfh")).json();
  $("wfh").setAttribute("aria-checked", wfh);
}
async function toggleAway() {
  await fetch("api/away", json("PUT", {away: $("away").getAttribute("aria-checked") !== "true"}));
  loadAway();
}
$("away").onclick = toggleAway;
$("away").onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleAway(); } };
async function toggleWfh() {
  await fetch("api/wfh", json("PUT", {wfh: $("wfh").getAttribute("aria-checked") !== "true"}));
  loadAway();
}
$("wfh").onclick = toggleWfh;
$("wfh").onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleWfh(); } };

// --- alarm -----------------------------------------------------------------------------------------
const ALARM_LABEL = {disarmed: "Alarm off", arming: "Arming…", armed_away: "Armed away", armed_home: "Armed home", pending: "Disarm now!", triggered: "ALARM"};
let incident = null;
async function loadAlarm() {
  const body = await (await fetch("api/alarm")).json(), state = body.state;
  incident = body.incident;
  $("alarm").hidden = state === "unavailable";
  $("alarm").dataset.state = state;
  $("alarm").textContent = state === "triggered" && incident?.status === "confirmed" ? "ALARM (confirmed)" : ALARM_LABEL[state] || state;
  const answering = state === "triggered" && incident?.status === "open", escalated = incident?.status === "confirmed";
  $("answer-menu").hidden = !(answering || escalated) || $("answer-menu").hidden;
  for (const b of $("answer-menu").querySelectorAll('[data-cmd="confirm"], [data-cmd="false_alarm"]')) b.hidden = !answering;
  $("answer-menu").querySelector('[data-cmd="stop"]').hidden = !escalated;
}
for (const b of document.querySelectorAll("#answer-menu [data-cmd]")) b.onclick = async () => {
  $("answer-menu").hidden = true;
  await fetch("api/alarm/" + b.dataset.cmd, {method: "POST"});
  await loadAlarm();
};
$("alarm").onclick = async () => {
  if ($("alarm").dataset.state === "disarmed") { $("arm-menu").hidden = !$("arm-menu").hidden; return; }
  if (($("alarm").dataset.state === "triggered" || incident?.status === "confirmed") && incident && incident.status !== "false_alarm"
      && $("answer-menu").hidden) { $("answer-menu").hidden = false; loadAlarm(); return; }
  await fetch("api/alarm/disarm", {method: "POST"});
  await loadAlarm(); loadAway();
};
for (const b of document.querySelectorAll("#arm-menu [data-cmd]")) b.onclick = async () => {
  $("arm-menu").hidden = true;
  await fetch("api/alarm/" + b.dataset.cmd, {method: "POST"});
  await loadAlarm(); loadAway();
};
setInterval(() => { loadAlarm(); loadAway(); }, 10000);

// --- live ----------------------------------------------------------------------------------------
async function loadLive() {
  const cams = await (await fetch("api/cameras")).json();
  $("f-camera").insertAdjacentHTML("beforeend", cams.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join(""));
  for (const c of cams) {
    const fig = document.createElement("figure");
    // Sub-streams are light enough to show all cameras at once; the name opens the main stream.
    fig.innerHTML = `<iframe loading="lazy" allow="autoplay" src="${GO2RTC}/stream.html?src=${encodeURIComponent(c.name)}_sub&mode=webrtc,mse"></iframe>
      <figcaption><a href="${GO2RTC}/stream.html?src=${encodeURIComponent(c.name)}" target="_blank">${esc(c.name)}</a><small>${esc(c.location)}</small></figcaption>
      <div class="hit" hidden></div>`;
    fig.dataset.camera = c.name;
    fig.querySelector("iframe").onload = e => bare(e.target);
    fig.querySelector(".hit").onclick = () => { picked = picked === c.name ? null : c.name; layoutWall(); };
    $("live").appendChild(fig);
  }
  if (location.hash === "#wall" || location.hash === "#wall-feed") openWall();
}

// --- wall view -----------------------------------------------------------------------------------
// All cameras sized to fill the window without scrolling. A camera with a person in view is outlined
// red and, with "Follow people", shown at double size; a click on a tile enlarges it until clicked again.
let picked = null, people = [], wakeLock = null, wallTimer = null;
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

// The player is served from this origin, so the wall can strip its label and controls: just the picture.
const BARE_CSS = ".info { display: none !important; } video::-webkit-media-controls { display: none !important; }";
function bare(iframe) {
  try {
    const doc = iframe.contentDocument;
    let style = doc.getElementById("wall-bare");
    if (!style) doc.head.appendChild(style = Object.assign(doc.createElement("style"), {id: "wall-bare"}));
    style.textContent = document.body.classList.contains("wall") ? BARE_CSS : "";
  } catch {}
}

function layoutWall() {
  if (!document.body.classList.contains("wall")) return;
  const figs = [...$("live").children];
  const follow = $("wall-follow").getAttribute("aria-pressed") === "true";
  const featured = picked ?? (follow ? people.find(c => figs.some(f => f.dataset.camera === c)) : null) ?? null;
  for (const f of figs) {
    f.classList.toggle("person", people.includes(f.dataset.camera));
    f.classList.toggle("featured", f.dataset.camera === featured);
  }
  // Pick the column count that gives the largest 16:9 tiles; a featured tile takes 2x2 cells.
  const W = innerWidth - 8, H = innerHeight - 8, gap = 4, cells = figs.length + (featured ? 3 : 0);
  let best = {w: 0};
  for (let cols = featured ? 2 : 1; cols <= cells; cols++) {
    const rows = Math.ceil(cells / cols);
    const w = Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows) * 16 / 9);
    if (w > best.w) best = {w, cols};
  }
  const live = $("live").style;
  live.setProperty("--cols", best.cols);
  live.setProperty("--tile-w", `${Math.floor(best.w)}px`);
  live.setProperty("--tile-h", `${Math.floor(best.w * 9 / 16)}px`);
}

async function pollWall() {
  try { people = (await (await fetch("api/activity")).json()).people; } catch { people = []; }
  const alarm = $("alarm");
  $("wall-alarm").textContent = alarm.hidden ? "" : alarm.textContent;
  layoutWall();
}

function tickClock() {
  $("wall-clock").textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
}

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}   // needs https; best effort
}

// One feed: a single video composed on the server (go2rtc's "wall" stream). The separate players are
// stopped meanwhile, so a weak device really only decodes one stream.
function setOneFeed(on) {
  $("wall-one").setAttribute("aria-pressed", on);
  $("wall-follow").hidden = on;
  for (const f of document.querySelectorAll("#live iframe")) {
    if (on && f.src !== "about:blank") { f.dataset.src = f.src; f.src = "about:blank"; }
    if (!on && f.dataset.src) { f.src = f.dataset.src; delete f.dataset.src; }
  }
  $("wall-feed").hidden = !on;
  $("wall-feed").innerHTML = on ? `<iframe allow="autoplay" src="${GO2RTC}/stream.html?src=wall&mode=webrtc,mse"></iframe>` : "";
  const feed = $("wall-feed").querySelector("iframe");
  if (feed) feed.onload = () => bare(feed);
  history.replaceState(null, "", on ? "#wall-feed" : "#wall");
}

function openWall() {
  showTab("live");
  document.body.classList.add("wall");
  $("wall-bar").hidden = false;
  for (const h of document.querySelectorAll("#live .hit")) h.hidden = false;
  for (const f of document.querySelectorAll("#live iframe")) bare(f);
  $("wall-follow").setAttribute("aria-pressed", store.get("wall-follow") !== "0");
  const one = location.hash === "#wall-feed" || store.get("wall-one") === "1";
  if (one) setOneFeed(true); else history.replaceState(null, "", "#wall");   // bookmarkable
  // Show the controls for a few seconds, then only on hover.
  document.body.classList.add("awake");
  setTimeout(() => document.body.classList.remove("awake"), 4000);
  tickClock(); pollWall(); keepAwake();
  wallTimer = setInterval(() => { tickClock(); pollWall(); }, 1500);
}

function closeWall() {
  if ($("wall-one").getAttribute("aria-pressed") === "true") setOneFeed(false);
  document.body.classList.remove("wall");
  $("wall-bar").hidden = true;
  for (const h of document.querySelectorAll("#live .hit")) h.hidden = true;
  for (const f of $("live").children) f.classList.remove("person", "featured");
  for (const f of document.querySelectorAll("#live iframe")) bare(f);
  clearInterval(wallTimer);
  wakeLock?.release().catch(() => {}); wakeLock = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  history.replaceState(null, "", location.pathname + location.search);
}

async function review(id, value, fig) {
  await fetch(`api/events/${id}/review`, json("POST", {review: value}));
  for (const b of fig.querySelectorAll("[data-value]")) b.setAttribute("aria-pressed", b.dataset.value === value);
}

function eventQuery() {
  const q = new URLSearchParams({limit: 200});
  if ($("f-kind").value) q.set("kind", $("f-kind").value);
  if ($("f-camera").value) q.set("camera", $("f-camera").value);
  const now = Date.now() / 1000, t = $("f-time").value;
  $("f-day").hidden = t !== "day";
  if (t === "1h") q.set("since", now - 3600);
  if (t === "24h") q.set("since", now - 86400);
  if (t === "7d") q.set("since", now - 7 * 86400);
  if (t === "today") q.set("since", new Date().setHours(0, 0, 0, 0) / 1000);
  if (t === "day" && $("f-day").value) {
    const d = new Date($("f-day").value + "T00:00");
    q.set("since", d / 1000); q.set("until", d / 1000 + 86400);
  }
  return q;
}
for (const id of ["f-kind", "f-camera", "f-time", "f-day"]) $(id).onchange = () => loadEvents();

let PEOPLE = [];
async function nameEvent(id, name) {
  await fetch(`api/events/${id}/person`, json("POST", {name: name || null}));
}
async function loadEvents() {
  const events = await (await fetch("api/events?" + eventQuery())).json();
  PEOPLE = await (await fetch("api/people")).json().catch(() => []);
  $("events").replaceChildren();
  $("status").textContent = events.length ? "" : "No events match.";
  for (const e of events) {
    const fig = document.createElement("figure");
    const media = e.clip ? `<video controls playsinline preload="none" poster="media/${e.snapshot}" src="media/${e.clip}"></video>`
                         : `<img loading="lazy" src="media/${e.snapshot}" alt="snapshot">`;
    const dl = (kind, text) => `<a class="chip" href="api/events/${e.id}/download/${kind}" download>${text}</a>`;
    const dur = e.end_ts ? `${Math.round(e.end_ts - e.start_ts)}s` : "ongoing";
    fig.innerHTML = `${media}
      <figcaption>
        <span><b>${esc(e.camera)}</b> ${e.person ? `<b class="who" title="${e.person_via ? "carried from " + esc(e.person_via) : "face"}">${esc(e.person)}${e.person_via ? "?" : ""}</b>` : esc(e.label)}${e.speed != null ? ` <b>${Math.round(e.speed)} km/h</b>` : ""}${e.plate ? ` <code>${esc(e.plate)}</code>` : ""} <small>${fmt(e.start_ts)} · ${dur}</small></span>
        <span class="score ${e.score >= 4 ? "high" : ""}" title="${esc(e.reasons.join(", "))}">score ${e.score}${e.notified ? " · notified" : ""}</span>
      </figcaption>
      <figcaption><small>${esc(e.reasons.join(" · "))}</small>
        <span><button class="chip" data-value="ok">Correct</button> <button class="chip" data-value="false_positive">False alarm</button></span>
      </figcaption>
      ${e.face ? `<figcaption><span style="display:flex;align-items:center;gap:8px"><img class="face" src="media/${e.face}" alt="face">
        <select data-act="who" aria-label="Who is this?"><option value="">Who is this?</option>${PEOPLE.map(p =>
          `<option ${p.name === e.person && !e.person_via ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></span></figcaption>` : ""}
      <figcaption class="downloads">
        <span>${e.crop ? `<button class="chip" data-act="closeup" aria-pressed="false">Close-up</button>` : ""}</span>
        <span>${dl("snapshot", "⤓ Picture")}${e.crop ? " " + dl("crop", "⤓ Close-up") : ""}${e.clip ? " " + dl("clip", "⤓ Video") : ""}</span>
      </figcaption>`;
    // The close-up is shown in place of the picture: a new window loses the Home Assistant session.
    const closeup = fig.querySelector('[data-act="closeup"]');
    if (closeup) closeup.onclick = () => {
      const on = closeup.getAttribute("aria-pressed") !== "true";
      closeup.setAttribute("aria-pressed", on);
      const el = fig.firstElementChild;
      el.replaceWith(Object.assign(document.createElement("div"), {innerHTML: on
        ? `<img src="media/${e.crop}" alt="vehicle close-up">` : media}).firstElementChild);
    };
    const who = fig.querySelector('[data-act="who"]');
    if (who) who.onchange = () => nameEvent(e.id, who.value);
    for (const b of fig.querySelectorAll("[data-value]")) {
      b.setAttribute("aria-pressed", b.dataset.value === e.review);
      b.onclick = () => review(e.id, b.getAttribute("aria-pressed") === "true" ? null : b.dataset.value, fig);
    }
    $("events").appendChild(fig);
  }
}

const getPath = (obj, path) => path.split(".").reduce((o, k) => o?.[k], obj);
function setPath(obj, path, value) {
  const keys = path.split("."), last = keys.pop();
  const target = keys.reduce((o, k) => (o[k] ??= {}), obj);
  if (value === undefined) delete target[last]; else target[last] = value;
}

function field(obj, [path, label, type, dflt, help, options, wide]) {
  const el = document.createElement("label");
  el.className = "field" + (wide ? " wide" : "") + (type === "bool" ? " toggle-field" : "");
  const value = getPath(obj, path);
  const changed = v => { setPath(obj, path, v); dirty(); };
  if (type === "bool") {
    el.innerHTML = `<span class="toggle" style="display:flex;align-items:center;gap:12px;font-size:14px;color:var(--fg)"><input type="checkbox"><span class="switch"></span>${esc(label)}</span>`;
    el.classList.add("toggle");
    const input = el.querySelector("input");
    input.checked = value ?? dflt;
    input.onchange = () => changed(input.checked);
  } else {
    let input;
    if (type === "select") {
      input = document.createElement("select");
      const opts = [...new Set([...(options || []), ...(value != null ? [String(value)] : [])])];
      input.innerHTML = opts.map(o => `<option>${esc(o)}</option>`).join("");
      input.value = value ?? dflt;
      input.onchange = () => changed(input.value);
    } else {
      input = document.createElement("input");
      input.type = type === "number" ? "number" : type === "password" ? "password" : "text";
      if (type === "number") input.step = "any";
      input.value = type === "list" ? (value || []).join(", ") : (value ?? "");
      input.placeholder = type === "list" ? (dflt || []).join(", ") : (dflt ?? "");
      input.oninput = () => {
        const raw = input.value.trim();
        if (raw === "") return changed(undefined);   // empty: back to the default
        if (type === "number") return changed(Number(raw));
        if (type === "list") return changed(raw.split(",").map(s => s.trim()).filter(Boolean));
        changed(input.value);
      };
    }
    el.innerHTML = `<span>${esc(label)}</span>`;
    el.appendChild(input);
    if (help) el.insertAdjacentHTML("beforeend", `<small class="muted">${esc(help)}</small>`);
  }
  return el;
}

function dirty() {
  unsaved = true;
  setStatus("msg muted", "Unsaved changes");
}

function setStatus(cls, text) {
  status = {cls, text};
  $("msg").className = cls;
  $("msg").textContent = text;
  $("save").disabled = !unsaved;
  $("restart").textContent = "Restart";
  delete $("restart").dataset.confirm;
}

      const render = list => {
        box.innerHTML = `<div class="people">${list.map(p => `<div class="row" style="padding:4px 0"><span><b>${esc(p.name)}</b> <small class="muted">${esc(p.group)} · ${p.faces} face${p.faces === 1 ? "" : "s"}${p.source === "ha" ? " · Home Assistant" : ""}</small></span>
            <span>${p.faces ? `<button class="chip" data-forget="${esc(p.name)}">Forget faces</button>` : ""}${p.source === "ha" ? "" : ` <button class="chip" data-remove="${esc(p.name)}">Remove</button>`}</span></div>`).join("")}</div>
          <div class="row" style="padding:8px 0"><label class="field"><span>Name</span><input data-new="name" placeholder="e.g. Farmor"></label>
            <label class="field"><span>Group</span><select data-new="group"><option>friend</option><option>family</option><option>neighbour</option><option>other</option></select></label>
            <button class="btn outlined" data-add>Add person</button></div>`;
        const call = async (url, opts) => { const r = await fetch(url, opts); if (r.ok) render(await r.json()); };
        for (const b of box.querySelectorAll("[data-remove]")) b.onclick = () => call(`api/people/${encodeURIComponent(b.dataset.remove)}`, {method: "DELETE"});
        for (const b of box.querySelectorAll("[data-forget]")) b.onclick = () => call(`api/people/${encodeURIComponent(b.dataset.forget)}/faces`, {method: "DELETE"});
        box.querySelector("[data-add]").onclick = () => call("api/people", json("POST", {
          name: box.querySelector('[data-new="name"]').value, group: box.querySelector('[data-new="group"]').value}));
      };
      fetch("api/people").then(r => r.json()).then(render);
      card.appendChild(box);
    }
    if (s.escalation) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<button class="btn outlined">Test for 15 seconds</button><small class="muted">Lights to full and the siren, then everything back as it was (saved settings, after a restart).</small>`;
      row.querySelector("button").onclick = async () => {
        const r = await fetch("api/escalation/test", {method: "POST"}); row.querySelector("small").textContent = r.ok ? "Running for 15 seconds…" : "Not set up (enable, save and restart first).";
      };
      card.appendChild(row);
    }
    if (s.smoke) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<button class="btn outlined">Test the smoke alarm</button><small class="muted">Sends the push marked TEST, with the pictures and the buttons.</small>`;
      row.querySelector("button").onclick = async () => {
        const r = await fetch("api/smoke/test", {method: "POST"}); row.querySelector("small").textContent = r.ok ? "Sent." : "Not set up (save and restart first).";
      };
      card.appendChild(row);
    }
    if (s.presence) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<button class="btn outlined">Preview today's plan</button><small class="muted"></small>`;
      const out = document.createElement("pre");
      out.style.cssText = "margin:0 16px 16px;white-space:pre-wrap;font-size:13px;color:var(--muted)";
      out.hidden = true;
      row.querySelector("button").onclick = async () => {
        const r = await fetch("api/presence"), b = await r.json().catch(() => ({}));
        out.hidden = false;
        out.textContent = !r.ok ? "Not available: " + (b.detail || r.status) + " (save, enable and restart first)"
          : `${b.learned_days} evenings learned. Today (${b.kind}; sunrise ${b.sunrise}, sunset ${b.sunset}) replays ${b.from || "nothing yet"}:\n`
            + b.actions.map(a => `${a.at}  ${a.on ? "on " : "off"}  ${a.light}${a.brightness ? ` (${a.brightness}%)` : ""}`).join("\n");
      };
      card.appendChild(row); card.appendChild(out);
    }
    if (s.test) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<button class="btn" data-act="test">Test the alarm now</button><small class="muted">Triggers it for real with the saved settings; disarm to stop.</small>`;
      row.querySelector("button").onclick = async () => { await fetch("api/alarm/trigger", {method: "POST"}); loadAlarm(); };
      card.appendChild(row);
    }
    root.appendChild(card);
  }

  const bar = document.createElement("div");
  bar.className = "savebar";
  bar.innerHTML = `<span id="msg"></span><button class="btn" id="restart">Restart</button><button class="btn filled" id="save">Save</button>`;
  root.appendChild(bar);
  $("save").onclick = save;
  $("restart").onclick = () => {
    const b = $("restart");
    if (unsaved && b.dataset.confirm !== "1") {   // two clicks instead of a confirm() dialog
      b.dataset.confirm = "1";
      b.textContent = "Restart without saving?";
      return;
    }
    restart();
  };
  setStatus(status.cls, status.text);
}

function cameraCard(name, cam) {
  const box = document.createElement("div");
  box.className = "cam";
  box.innerHTML = `<div class="cam-head"><b>${esc(name)}</b><button class="btn" data-act="zones">Zones &amp; masks</button><button class="btn danger" data-act="remove">Remove</button></div>`;
  const grid = document.createElement("div");
  grid.className = "fields";
  for (const f of CAMERA_FIELDS) grid.appendChild(field(cam, f));
  box.appendChild(grid);
  const editor = document.createElement("div");
  editor.className = "editor";
  editor.hidden = true;
  box.appendChild(editor);
  box.querySelector('[data-act="remove"]').onclick = () => {
    if (box.dataset.confirm !== "1") {   // two clicks instead of a confirm() dialog
      box.dataset.confirm = "1";
      box.querySelector('[data-act="remove"]').textContent = "Click again to remove";
      return;
    }
    delete config.cameras[name];
    dirty(); renderSettings();
  };
  const toggle = open => {
    editor.hidden = !open;
    if (open) openEditors.add(name); else openEditors.delete(name);
    if (open && !editor.firstChild) zoneEditor(editor, name, cam);
  };
  box.querySelector('[data-act="zones"]').onclick = () => toggle(editor.hidden);
  if (openEditors.has(name)) toggle(true);
  return box;
}

// Polygons are stored flat ([x1, y1, x2, y2, ...], normalised 0..1), as in Frigate.
const toPoints = flat => { const p = []; for (let i = 0; i + 1 < (flat || []).length; i += 2) p.push([flat[i], flat[i + 1]]); return p; };
const toFlat = pts => pts.flatMap(([x, y]) => [Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000]);
const isFlat = v => Array.isArray(v) && v.every(n => typeof n === "number");
const normalise = v => isFlat(v) ? toPoints(v) : (v || []).map(p => [p[0], p[1]]);
const LAYER_COLORS = {person_mask: "#db4437", motion_mask: "#ff9800", speed_a: "#43a047", speed_b: "#8e24aa"};
const LINES = ["speed_a", "speed_b"];   // two-point lines, not polygons
const LAYER_NAMES = {person_mask: "Person mask", motion_mask: "Motion mask", speed_a: "Speed line A", speed_b: "Speed line B"};
const LAYER_HINTS = {
  person_mask: "Person mask: a person whose feet (bottom middle of the box) are inside it is ignored. Cover spots that fool the detector, like coats on a hook, not the area you want watched.",
  motion_mask: "Motion mask: movement inside it is ignored, such as trees, a TV or the camera's clock.",
  speed_a: "Speed lines: two clicks each, across the road where the wheels touch it.",
  speed_b: "Speed lines: two clicks each, across the road where the wheels touch it.",
};

function zoneEditor(root, name, cam) {
  const layers = {};
  for (const [z, poly] of Object.entries(cam.zones || {})) layers["zone:" + z] = normalise(poly);
  layers.person_mask = normalise(cam.person_mask);
  layers.motion_mask = normalise(cam.motion_mask);
  layers.speed_a = normalise(cam.speed?.line_a);
  layers.speed_b = normalise(cam.speed?.line_b);
  let active = Object.keys(layers)[0], dragging = null;

  root.innerHTML = `
    <div class="layers"></div>
    <div class="stage"><img alt="snapshot of ${esc(name)}" src="${GO2RTC}/api/frame.jpeg?src=${encodeURIComponent(name)}_sub&t=${Date.now()}"><canvas></canvas></div>
    <div class="layers">
      <input placeholder="new zone name"><button class="chip" data-act="add">Add zone</button>
      <button class="chip" data-act="undo">Undo point</button><button class="chip" data-act="clear">Clear</button>
      <button class="chip" data-act="delete">Delete zone</button><button class="chip" data-act="refresh">New snapshot</button>
      <small class="muted">Click to add points, drag to move them.</small>
    </div>
    <p class="muted layer-hint"></p>`;
  const canvas = root.querySelector("canvas"), img = root.querySelector("img"), ctx = canvas.getContext("2d");
  const chips = root.querySelector(".layers");

  function commit() {
    const zones = {};
    for (const [k, pts] of Object.entries(layers)) if (k.startsWith("zone:") && pts.length >= 3) zones[k.slice(5)] = toFlat(pts);
    if (Object.keys(zones).length) cam.zones = zones; else delete cam.zones;
    for (const m of ["person_mask", "motion_mask"]) {
      if (layers[m].length >= 3) cam[m] = toFlat(layers[m]); else delete cam[m];
    }
    for (const [m, key] of [["speed_a", "line_a"], ["speed_b", "line_b"]]) {
      if (layers[m].length === 2) (cam.speed ??= {})[key] = toFlat(layers[m]);
      else if (cam.speed) delete cam.speed[key];
    }
    if (cam.speed && !Object.keys(cam.speed).length) delete cam.speed;
    dirty();
  }

  function renderChips() {
    chips.innerHTML = Object.keys(layers).map(k => {
      const label = k.startsWith("zone:") ? k.slice(5) : LAYER_NAMES[k];
      const color = LAYER_COLORS[k] || "#03a9f4";
      return `<button class="chip" data-layer="${esc(k)}" aria-pressed="${k === active}"><span class="legend" style="background:${color}"></span>${esc(label)}</button>`;
    }).join("");
    for (const b of chips.querySelectorAll("[data-layer]")) b.onclick = () => { active = b.dataset.layer; renderChips(); draw(); };
    root.querySelector('[data-act="delete"]').disabled = !active?.startsWith("zone:");
    root.querySelector(".layer-hint").textContent = active?.startsWith("zone:")
      ? "Zone: events note the zones a person was in, and alarm rules can use them (door zones)." : LAYER_HINTS[active] || "";
  }

  function draw() {
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * devicePixelRatio; canvas.height = r.height * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    for (const [k, pts] of Object.entries(layers)) {
      if (!pts.length) continue;
      const color = LAYER_COLORS[k] || "#03a9f4", on = k === active;
      ctx.beginPath();
      pts.forEach(([x, y], i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, x * r.width, y * r.height));
      if (LINES.includes(k)) {
        ctx.lineWidth = on ? 4 : 3; ctx.strokeStyle = color; ctx.stroke();
        if (on) for (const [x, y] of pts) { ctx.beginPath(); ctx.arc(x * r.width, y * r.height, 5, 0, 7); ctx.fillStyle = "#fff"; ctx.fill(); ctx.stroke(); }
        continue;
      }
      ctx.closePath();
      ctx.fillStyle = color + (on ? "55" : "30"); ctx.fill();
      ctx.lineWidth = on ? 2.5 : 1.5; ctx.strokeStyle = color; ctx.stroke();
      if (on) for (const [x, y] of pts) { ctx.beginPath(); ctx.arc(x * r.width, y * r.height, 5, 0, 7); ctx.fillStyle = "#fff"; ctx.fill(); ctx.stroke(); }
    }
  }

  const pos = e => { const r = canvas.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
  canvas.onpointerdown = e => {
    if (!active) return;
    const [x, y] = pos(e), r = canvas.getBoundingClientRect(), pts = layers[active];
    const near = pts.findIndex(([px, py]) => Math.hypot((px - x) * r.width, (py - y) * r.height) < 10);
    if (near >= 0) dragging = near;
    else if (LINES.includes(active) && pts.length >= 2) return;   // a line has two ends
    else { pts.push([x, y]); commit(); }
    canvas.setPointerCapture(e.pointerId); draw();
  };
  canvas.onpointermove = e => { if (dragging !== null) { layers[active][dragging] = pos(e); draw(); } };
  canvas.onpointerup = () => { if (dragging !== null) { dragging = null; commit(); } };

  const act = a => root.querySelector(`[data-act="${a}"]`);
  act("add").onclick = () => {
    const input = root.querySelector("input"), z = input.value.trim().replace(/\s+/g, "_");
    if (!z || layers["zone:" + z]) return;
    layers["zone:" + z] = []; active = "zone:" + z; input.value = ""; renderChips(); draw();
  };
  act("undo").onclick = () => { layers[active]?.pop(); commit(); draw(); };
  act("clear").onclick = () => { if (layers[active]) layers[active] = []; commit(); draw(); };
  act("delete").onclick = () => { if (!active?.startsWith("zone:")) return; delete layers[active]; active = Object.keys(layers)[0]; commit(); renderChips(); draw(); };
  act("refresh").onclick = () => { img.src = `${GO2RTC}/api/frame.jpeg?src=${encodeURIComponent(name)}_sub&t=${Date.now()}`; };
  img.onload = draw;
  new ResizeObserver(draw).observe(canvas);
  renderChips(); draw();
}

async function save() {
  document.activeElement?.blur?.();   // commit a field still being edited
  $("save").disabled = true;
  const r = await fetch("api/config", json("PUT", config));
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    $("msg").className = "msg error";
    $("msg").textContent = "Not saved: " + (body.detail || r.status);
    $("save").disabled = false;
    return;
  }
  unsaved = false;
  status = {cls: "msg ok", text: body.changed ? "Saved. Restart to apply the changes." : "Nothing changed."};
  // Rebuild the form on the stored config (masked secrets), so later edits change what is sent next.
  config = await (await fetch("api/config")).json();
  const y = scrollY;
  renderSettings();
  scrollTo(0, y);
}

async function restart() {
  $("overlay").hidden = false;
  await fetch("api/restart", {method: "POST"}).catch(() => {});
  await new Promise(r => setTimeout(r, 3000));
  for (let i = 0; i < 120; i++) {
    try { if ((await fetch("api/cameras")).ok) { location.reload(); return; } } catch {}
    await new Promise(r => setTimeout(r, 1000));
  }
  $("overlay").textContent = "SmartCam did not come back. Check its log.";
}

loadAway();
loadAlarm();
loadLive().catch(e => { $("status").textContent = "failed to load cameras: " + e; });
</script>
